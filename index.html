<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNOnlineshop | ร้านอุปกรณ์อิเล็กทรอนิกส์</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#fff;padding:16px 5%;box-shadow:0 2px 6px #ddd}
.brand{color:#ee4d2d;font-size:27px;font-weight:bold}
header p{margin:5px 0;color:#777;font-size:13px}
.search{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-top:12px;font-size:16px}
nav{display:flex;gap:9px;overflow:auto;padding:13px 5%;background:white}
nav button{white-space:nowrap;border:1px solid #eee;background:#fff;padding:9px 13px;border-radius:20px;cursor:pointer}
nav button:hover{background:#fff0eb;color:#ee4d2d}
.banner{margin:16px 5%;padding:24px 20px;background:linear-gradient(120deg,#ee4d2d,#ff9a62);color:white;border-radius:12px}
.banner h2{margin:0 0 8px}
.banner p{margin:0}
main{padding:0 5% 30px}
.section-title{font-size:20px;margin:22px 0 14px}
.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:white;border-radius:9px;overflow:hidden;border:1px solid #eee}
.photo{height:165px;background:#fff4ef;display:flex;align-items:center;justify-content:center;font-size:65px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:12px}
.name{font-size:15px;min-height:40px;line-height:1.4}
.price{color:#ee4d2d;font-size:21px;font-weight:bold;margin:9px 0}
.note{color:#888;font-size:12px;margin-bottom:10px}
.buy{width:100%;padding:10px;border:0;border-radius:5px;background:#ee4d2d;color:white;font-size:14px;cursor:pointer}
.buy:hover{background:#d83c20}
.cart{position:fixed;right:16px;bottom:16px;background:#ee4d2d;color:white;padding:13px 18px;border-radius:30px;border:0;box-shadow:0 3px 12px #aaa;cursor:pointer}
footer{text-align:center;background:#222;color:white;padding:25px 10px;font-size:13px}
@media(max-width:800px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}.photo{height:135px}}
@media(max-width:520px){.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{height:125px}.info{padding:9px}.name{font-size:14px}.price{font-size:19px}.banner{padding:20px 15px}}
</style>
</head>
<body>
<header>
<div class="brand">SNOnlineshop</div>
<p>ร้านอุปกรณ์อิเล็กทรอนิกส์และอุปกรณ์ DIY</p>
<input class="search" id="search" placeholder="ค้นหาสินค้า..." oninput="render()">
</header>
<nav>
<button onclick="category='ทั้งหมด';render()">ทั้งหมด</button>
<button onclick="category='ESP32';render()">ESP32</button>
<button onclick="category='อุปกรณ์ DIY';render()">อุปกรณ์ DIY</button>
<button onclick="category='อื่นๆ';render()">อื่นๆ</button>
</nav>
<section class="banner">
<h2>ยินดีต้อนรับสู่ SNOnlineshop</h2>
<p>ค้นหาอุปกรณ์ที่คุณต้องการได้ที่นี่</p>
</section>
<main>
<h2 class="section-title">สินค้าของเรา</h2>
<div class="products" id="products"></div>
</main>
<button class="cart" onclick="showCart()">ตะกร้า (<span id="count">0</span>)</button>
<footer>
<strong>SNOnlineshop</strong>
<p>ขอบคุณที่แวะมาเยี่ยมชมร้านของเรา</p>
<p>สอบถามรายละเอียดสินค้าก่อนสั่งซื้อ</p>
</footer>
<script>
/* ============================================================
   วิธีเพิ่มสินค้า: เพิ่มบรรทัดใหม่ใน items ตามแบบนี้
   {name:"ชื่อสินค้า", price:150, cat:"ESP32", emoji:"🔌", img:""},
   - cat  ต้องพิมพ์ตรงกับปุ่มหมวดหมู่: ESP32 / อุปกรณ์ DIY / อื่นๆ
   - emoji ใช้เมื่อยังไม่มีรูปจริง
   - img   ใส่ลิงก์รูป เช่น "images/esp32.jpg" (ถ้ามีรูปแล้วจะแสดงรูปแทน emoji อัตโนมัติ)
   ============================================================ */
const items=[
  {name:"nRFbox V2",price:1450,cat:"อุปกรณ์ DIY",emoji:"📟",img:""},
  {name:"ESP32-C3 Mini",price:78,cat:"ESP32",emoji:"🔌",img:""},
  {name:"ESP32 DevKit",price:123,cat:"ESP32",emoji:"💻",img:""},
  {name:"อุปกรณ์อิเล็กทรอนิกส์ DIY",price:99,cat:"อุปกรณ์ DIY",emoji:"🔧",img:""}
];
let category="ทั้งหมด";
let cart=[];
function render(){
  const q=document.getElementById("search").value.toLowerCase();
  const list=items.filter(p=>
    (category==="ทั้งหมด"||p.cat===category)&&p.name.toLowerCase().includes(q)
  );
  document.getElementById("products").innerHTML=list.map(p=>`
    <article class="card">
      <div class="photo">${p.img?`<img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.parentElement.textContent='${p.emoji}'">`:p.emoji}</div>
      <div class="info">
        <div class="name">${p.name}</div>
        <div class="price">฿${p.price.toLocaleString("th-TH")}</div>
        <div class="note">สอบถามสต็อกก่อนสั่งซื้อ</div>
        <button class="buy" onclick="addCart('${p.name}')">เพิ่มลงตะกร้า</button>
      </div>
    </article>
  `).join("");
  if(!list.length)document.getElementById("products").innerHTML="ไม่พบสินค้าที่ค้นหา";
}
function addCart(name){
  cart.push(name);
  document.getElementById("count").textContent=cart.length;
  alert("เพิ่ม "+name+" ลงตะกร้าแล้ว");
}
function showCart(){
  if(!cart.length){alert("ตะกร้าของคุณยังว่างอยู่");return;}
  const summary=cart.reduce((a,n)=>(a[n]=(a[n]||0)+1,a),{});
  alert("สินค้าในตะกร้า:\n"+Object.entries(summary).map(([n,c])=>n+" x "+c).join("\n")+"\n\nกรุณาติดต่อร้านเพื่อยืนยันคำสั่งซื้อ");
}
render();
</script>
</body>
</html>
